name: mcp-vet
description: Scan MCP servers for tool poisoning, over-permission, schema weaknesses, rug pulls and tool shadowing.
author: Osama Wehbi
branding:
  icon: shield
  color: red

inputs:
  args:
    description: >
      Inputs passed to `mcp-vet scan`, for example `-c .vscode/mcp.json --lock mcp-vet.lock`
      or `tools.json`. Do not include --format or --output; use the inputs below.
    required: true
  fail-on:
    description: Fail the step when a finding is at or above this severity (high, medium, low, info or none).
    default: high
  sarif:
    description: Where to write the SARIF report. Upload it with github/codeql-action/upload-sarif.
    default: mcp-vet.sarif
  python-version:
    description: Python version used to run mcp-vet.
    default: "3.12"

outputs:
  sarif:
    description: Path of the SARIF report.
    value: ${{ inputs.sarif }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install mcp-vet
      shell: bash
      run: python -m pip install --quiet "$GITHUB_ACTION_PATH"
    - name: Run mcp-vet
      shell: bash
      env:
        MCP_VET_ARGS: ${{ inputs.args }}
        MCP_VET_FAIL_ON: ${{ inputs.fail-on }}
        MCP_VET_SARIF: ${{ inputs.sarif }}
      # Inputs are passed through environment variables, never interpolated into the script,
      # so a malicious input cannot inject shell commands.
      run: |
        read -r -a args <<< "$MCP_VET_ARGS"
        mcp-vet scan "${args[@]}" \
          --format sarif --output "$MCP_VET_SARIF" \
          --fail-on "$MCP_VET_FAIL_ON" \
          --summary "$GITHUB_STEP_SUMMARY"
